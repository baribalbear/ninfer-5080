name: Windows native build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned toolchain artifacts. Keep these in lockstep with
  # docs/REPRODUCIBILITY.md when the CUDA baseline changes.
  CMAKE_VERSION: "4.4.4"
  CMAKE_ZIP_URL: "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-x86_64.zip"
  CMAKE_ZIP_SHA256: "bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536"
  VCPKG_TAG: "2026.07.29"
  CUDA_INSTALLER_URL: "https://developer.download.nvidia.com/compute/cuda/13.4.1/local_installers/cuda_13.4.1_windows_x86_64.exe"
  CUDA_INSTALLER_SHA256: "632a5912995473cea77b24788715b8d94db17a94cfea102a12f72c3614fe8c7e"
  # Default silent-install location for the CUDA toolkit bundle.
  CUDA_ROOT: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4

jobs:
  build:
    # Native Windows build gate: MSVC (Visual Studio Build Tools, preinstalled
    # on windows-latest) + nvcc for sm_120a + native MSVC FFmpeg/libcurl
    # built by vcpkg. GitHub-hosted runners have no GPU, so this job compiles
    # and links only; it is not an execution test.
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install pinned CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "cmake-windows-x86_64.zip"
          Invoke-WebRequest -Uri $env:CMAKE_ZIP_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($hash -ne $env:CMAKE_ZIP_SHA256) { throw "CMake zip SHA256 mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "cmake")
          $bin = Join-Path $env:RUNNER_TEMP "cmake\cmake-$env:CMAKE_VERSION-windows-x86_64\bin"
          if (-not (Test-Path $bin)) { throw "CMake bin dir not found at $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          cmake --version

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg $vcpkg
          Push-Location $vcpkg
          sh bootstrap-vcpkg.sh
          .\vcpkg.exe version

      - name: Install native MSVC dependencies (FFmpeg, libcurl, pkg-config)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          $installed = Join-Path $env:RUNNER_TEMP "vcpkg-installed"

          # Port "curl" provides libcurl (see ports/curl in the vcpkg repo).
          # Port "pkgconf" provides the native pkg-config executable that the
          # CMake build uses to discover FFmpeg and libcurl.
          # NOTE: the Actions pwsh shell exits the step with $LASTEXITCODE of the
          # last native command, so every native invocation below records its
          # exit code explicitly and the step ends with cmdlet-only statements.
          & "$vcpkg\vcpkg.exe" install --triplet x64-windows --x-install-root $installed ffmpeg curl pkgconf
          $vcpkgExit = $LASTEXITCODE
          Write-Host "vcpkg install exit code: $vcpkgExit"
          if ($vcpkgExit -ne 0) { throw "vcpkg install failed with exit code $vcpkgExit" }

          # CMake's FindPkgConfig module looks up a program named "pkg-config";
          # vcpkg ships it as "pkgconf", so expose a copy under the expected name.
          # vcpkg_copy_tools places tool executables in the per-triplet tools
          # directory (x64-windows\tools\pkgconf), not in x64-windows\bin.
          $tools = "C:\ninfer-tools\bin"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $pkgconf = Join-Path $installed "x64-windows\tools\pkgconf\pkgconf.exe"
          if (-not (Test-Path $pkgconf)) { throw "pkgconf.exe not found at $pkgconf" }

          # Diagnostics: file metadata for the installed pkgconf tool.
          Get-Item $pkgconf | Format-List Name, Length, LastWriteTime, Attributes
          Write-Host "pkgconf sha256: $((Get-FileHash $pkgconf -Algorithm SHA256).Hash)"
          Write-Host "--- x64-windows\tools tree ---"
          Get-ChildItem (Join-Path $installed "x64-windows\tools") -Recurse -File | ForEach-Object { Write-Host "$($_.Length) $($_.FullName)" }
          $bindir = Join-Path $installed "x64-windows\bin"
          Write-Host "--- x64-windows\bin (if any) ---"
          if (Test-Path $bindir) { Get-ChildItem $bindir -File | ForEach-Object { Write-Host "$($_.Length) $($_.FullName)" } } else { Write-Host "(no bin dir)" }
          Write-Host "--- pkg-config on runner PATH (informational) ---"
          $existing = Get-Command pkg-config -ErrorAction SilentlyContinue
          if ($existing) { Write-Host "$($existing.Source)" } else { Write-Host "(none)" }

          Copy-Item $pkgconf (Join-Path $tools "pkg-config.exe")
          Add-Content -Path $env:GITHUB_PATH -Value $tools

          # Probe pkg-config --version three ways and record each exit code.
          $copied = Join-Path $tools "pkg-config.exe"
          Write-Host "--- probe 1: copied pkg-config.exe --version (pwsh &) ---"
          & $copied --version
          $eCopied = $LASTEXITCODE
          Write-Host "probe 1 exit: $eCopied"
          Write-Host "--- probe 2: installed pkgconf.exe --version (pwsh &) ---"
          & $pkgconf --version
          $eInPlace = $LASTEXITCODE
          Write-Host "probe 2 exit: $eInPlace"
          Write-Host "--- probe 3: installed pkgconf.exe --version (cmd /c) ---"
          & cmd /c $pkgconf --version
          $eCmd = $LASTEXITCODE
          Write-Host "probe 3 exit: $eCmd"
          Write-Host "--- first 64 bytes of pkgconf.exe ---"
          $head = [System.IO.File]::ReadAllBytes($pkgconf)[0..63]
          Write-Host (($head | ForEach-Object { $_.ToString('x2') }) -join ' ')

          # The C++ build discovers FFmpeg/libcurl through pkg-config .pc
          # files generated by the vcpkg ports.
          # .pc files are installed under the per-triplet lib\pkgconfig dir.
          $pcdir = Join-Path $installed "x64-windows\lib\pkgconfig"
          $pcfiles = Get-ChildItem $pcdir -Filter "*.pc" | Select-Object -ExpandProperty Name
          Write-Host "pkgconfig modules: $($pcfiles -join ', ')"
          foreach ($need in "libavformat.pc","libavcodec.pc","libavutil.pc","libswscale.pc","libcurl.pc") {
            if ($pcfiles -notcontains $need) { throw "missing $need in $pcdir" }
          }

          if ($eCopied -ne 0 -or $eInPlace -ne 0 -or $eCmd -ne 0) {
            throw "pkg-config --version failed (copied=$eCopied, inplace=$eInPlace, cmd=$eCmd); see probe diagnostics above"
          }

      - name: Install CUDA toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "cuda_windows_x86_64.exe"
          Invoke-WebRequest -Uri $env:CUDA_INSTALLER_URL -OutFile $installer
          if ($env:CUDA_INSTALLER_SHA256) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLower()
            if ($hash -ne $env:CUDA_INSTALLER_SHA256) {
              throw "CUDA installer SHA256 mismatch: expected $($env:CUDA_INSTALLER_SHA256), got $hash"
            }
          }

          # Silent install. Since CUDA 13.1 the Windows toolkit no longer
          # bundles the GPU driver, so no driver is installed here.
          $proc = Start-Process -FilePath $installer -ArgumentList "/s" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "CUDA installer exited with $($proc.ExitCode)" }

          $nvcc = Join-Path $env:CUDA_ROOT "bin\nvcc.exe"
          if (-not (Test-Path $nvcc)) { throw "nvcc not found at $nvcc" }
          & $nvcc --version
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:CUDA_ROOT "bin")

      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PKG_CONFIG_LIBDIR = Join-Path (Join-Path $env:RUNNER_TEMP "vcpkg-installed") "x64-windows\lib\pkgconfig"
          $env:PKG_CONFIG_PATH = $env:PKG_CONFIG_LIBDIR

          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Validate build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = @("build\apps\ninfer.exe", "build\apps\ninfer-serve.exe")
          foreach ($path in $artifacts) {
            if (-not (Test-Path $path)) { throw "missing build artifact $path" }
            "{0}: {1} bytes" -f $path, (Get-Item $path).Length
          }

          $env:PKG_CONFIG_LIBDIR = Join-Path (Join-Path $env:RUNNER_TEMP "vcpkg-installed") "x64-windows\lib\pkgconfig"
          $env:PKG_CONFIG_PATH = $env:PKG_CONFIG_LIBDIR

          Write-Host "=== toolchain summary ==="
          cmake --version | Select-Object -First 1
          & "$env:CUDA_ROOT\bin\nvcc.exe" --version
          & "C:\ninfer-tools\bin\pkg-config.exe" --modversion libavformat libavcodec libavutil libswscale libcurl

      - name: Upload Windows binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-x64-sm120a
          path: |
            build/apps/ninfer.exe
            build/apps/ninfer-serve.exe
          if-no-files-found: error

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows native build"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Native MSVC + CUDA 13.4 build for sm_120a (compile/link only; no GPU on hosted runners)."
          

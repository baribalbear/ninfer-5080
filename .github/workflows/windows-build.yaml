name: Build (Windows + latest CUDA)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install latest CUDA toolkit
        run: winget install --id NVIDIA.CUDA --silent --accept-source-agreements --accept-package-agreements

      - name: Detect installed CUDA version
        run: |
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA"
          $ver = Get-ChildItem $root |
                 Sort-Object { [version]($_.Name -replace '^v','') } -Descending |
                 Select-Object -First 1 -ExpandProperty Name
          Write-Host "Using CUDA $ver"
          Add-Content $env:GITHUB_PATH "$root\$ver\bin"
          Add-Content $env:GITHUB_ENV "CUDA_BIN=$root\$ver\bin"
          Add-Content $env:GITHUB_ENV "CUDA_LIB=$root\$ver\lib\x64"

      - name: Expose CUDA toolkit to CMake
        run: |
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA"
          $ver = Get-ChildItem $root |
                 Sort-Object { [version]($_.Name -replace '^v','') } -Descending |
                 Select-Object -First 1 -ExpandProperty Name
          if (-not (Test-Path "$root\$ver\bin\nvcc.exe")) { throw "CUDA toolkit not found at $root\$ver" }
          Add-Content $env:GITHUB_PATH "$root\$ver\bin"
          Add-Content $env:GITHUB_ENV "CUDA_TOOLKIT_ROOT=$root\$ver"
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$root\$ver"
          Add-Content $env:GITHUB_ENV "CUDA_LIB=$root\$ver\lib\x64"
          Add-Content $env:GITHUB_ENV "CudaToolkitDir=$root\$ver"

      - name: Verify
        run: nvcc --version

      - name: Install MSVC Build Tools
        run: |
          winget install --id Microsoft.VisualStudio.BuildTools `
            --override "--quiet --wait --norestart --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows11SDK.22621"
        
      - name: Configure + build (Ninja)
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA"
          $ver = (Get-ChildItem $cudaRoot).Name
          $env:PATH += ";$cudaRoot\$ver\bin"

          # sanity probe: nvcc standalone, proves the toolkit is sound
          Set-Content probe.cu "int main(){return 0;}"
          nvcc probe.cu -o probe.exe

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_COMPILER="$cudaRoot\$ver\bin\nvcc.exe" `
            -DCMAKE_CUDA_ARCHITECTURES="120a"
          cmake --build build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ninner-windows-x64
          path: build/

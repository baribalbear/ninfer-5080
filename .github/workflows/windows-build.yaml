name: Windows native build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned toolchain artifacts. Keep these in lockstep with
  # docs/REPRODUCIBILITY.md when the CUDA baseline changes.
  CMAKE_VERSION: "4.4.4"
  CMAKE_ZIP_URL: "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-x86_64.zip"
  CMAKE_ZIP_SHA256: "bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536"
  VCPKG_TAG: "2026.07.29"
  CUDA_INSTALLER_URL: "https://developer.download.nvidia.com/compute/cuda/13.4.1/local_installers/cuda_13.4.1_windows_x86_64.exe"
  CUDA_INSTALLER_SHA256: "632a5912995473cea77b24788715b8d94db17a94cfea102a12f72c3614fe8c7e"
  # Default silent-install location for the CUDA toolkit bundle.
  CUDA_ROOT: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4

jobs:
  build:
    # Native Windows build gate: MSVC (Visual Studio Build Tools, preinstalled
    # on windows-latest) + nvcc for sm_120a + native MSVC FFmpeg/libcurl
    # built by vcpkg. GitHub-hosted runners have no GPU, so this job compiles
    # and links only; it is not an execution test.
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The runner's VS (currently VS 2026 / 18.x) ships MSVC but no
      # activated developer environment: cl.exe is not on PATH. nvcc
      # refuses to run without a host compiler ("Cannot find compiler
      # 'cl.exe' in PATH"), and CMake falls back to the preinstalled GCC,
      # which cannot link against the MSVC-built vcpkg libraries. Enter the
      # VS dev shell (probing known entry-point locations, since the layout
      # moved between VS generations) and persist the resulting environment
      # so every later step sees the MSVC toolchain.
      - name: Set up MSVC developer environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          # Several vswhere invocations, most specific first (the -latest
          # form is known to work on this image). Capture both streams and
          # the exit code so a silent vswhere failure is visible; if none
          # yields an installation, dump the raw outputs as public
          # annotations.
          $attempts = @(
            @("-latest", "-products", "*", "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "-property", "installationPath"),
            @("-products", "*", "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "-property", "installationPath"),
            @("-latest", "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "-property", "installationPath"),
            @("-all", "-products", "*", "-property", "installationPath"),
            @("-all", "-property", "installationPath,installationVersion")
          )
          $installs = @()
          $rawOutputs = @()
          foreach ($a in $attempts) {
            $label = $a -join " "
            $out = (& $vswhere @a 2>&1 | Out-String).Trim()
            $code = $LASTEXITCODE
            $rawOutputs += "[$label] exit $code : $out"
            Write-Host ("vswhere [" + $label + "] exit " + $code + ": " + $out)
            if ($installs.Count -eq 0) {
              foreach ($line in (@($out -split "`r?`n") | Where-Object { $_.Trim() })) {
                $installs += @{ Path = ($line -split ';', 2)[0].Trim() }
              }
              $installs = @($installs | Where-Object { Test-Path $_.Path })
            }
            if ($installs.Count -gt 0) { break }
          }
          if ($installs.Count -eq 0) {
            foreach ($r in $rawOutputs) {
              [Console]::Error.WriteLine("::error::vswhere " + $r)
            }
            throw "vswhere returned no Visual Studio installations (raw outputs in annotations)"
          }
          Write-Host ("VS installation(s): " + (($installs | ForEach-Object { $_.Path }) -join "; "))

          # Known dev-shell entry points across VS generations.
          function Get-DevShellCandidates { param([string]$Vs)
            return @(
              (Join-Path $Vs "Common7\Tools\Enter-VsDevShell.ps1"),
              (Join-Path $Vs "VC\Auxiliary\Build\Enter-VsDevShell.ps1"),
              (Join-Path $Vs "Common7\Tools\VsDevCmd.bat"),
              (Join-Path $Vs "VC\Auxiliary\Build\VsDevCmd.bat")
            )
          }

          $entry = $null
          foreach ($inst in $installs) {
            foreach ($cand in (Get-DevShellCandidates $inst.Path)) {
              if (Test-Path $cand) { $entry = $cand; break }
            }
            if ($entry) { break }
          }

          if (-not $entry) {
            # No known entry point: dump the directory layout as public
            # annotations so the actual VS generation layout is readable
            # without log download access.
            foreach ($inst in $installs) {
              foreach ($rel in @("Common7\Tools", "VC\Auxiliary\Build", "VC\Tools\MSVC")) {
                $dir = Join-Path $inst.Path $rel
                if (Test-Path $dir) {
                  $entries = (Get-ChildItem $dir -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ", "
                  if (-not $entries) { $entries = (Get-ChildItem $dir -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ", " }
                  [Console]::Error.WriteLine("::error::VS layout: $rel -> $entries")
                } else {
                  [Console]::Error.WriteLine("::error::VS layout: $rel -> (missing)")
                }
              }
            }
            throw "no dev shell entry point (Enter-VsDevShell.ps1 / VsDevCmd.bat) found"
          }

          Write-Host "Using dev shell entry point: $entry"
          if ($entry.EndsWith(".ps1")) {
            & $entry -Arch amd64 -SkipAutomaticLocation
          } else {
            # Batch entry point: run it through a temp .cmd (no PowerShell
            # to cmd quoting involved) and import the resulting environment
            # into this process.
            $tmpBat = Join-Path $env:RUNNER_TEMP "import-devshell.cmd"
            Set-Content -Path $tmpBat -Value @("@echo off", "call `"$entry`" -arch=x64", "if errorlevel 1 exit /b 1", "set")
            $out = & $tmpBat
            if ($LASTEXITCODE -ne 0) { throw "dev shell batch entry failed (exit $LASTEXITCODE)" }
            foreach ($line in $out) {
              if ($line -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
              }
            }
          }

          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) {
            foreach ($n in @("PATH", "INCLUDE", "LIB")) {
              [Console]::Error.WriteLine("::error::env $n = " + ([Environment]::GetEnvironmentVariable($n, "Process")))
            }
            throw "cl.exe is not on PATH after entering the VS dev shell"
          }
          Write-Host "cl.exe resolved to: $($cl.Source)"
          Write-Host ("cl version: " + ((& cl.exe --version 2>&1 | Out-String).Trim()))

          # The dev shell only affects this process; persist the MSVC
          # environment for all subsequent steps.
          foreach ($name in @("PATH", "INCLUDE", "LIB", "VSINSTALLDIR", "VCToolsInstallDir", "VCINSTALLDIR", "VS170COMNTOOLS", "VS180COMNTOOLS", "MSBuildVersion")) {
            $value = [Environment]::GetEnvironmentVariable($name, "Process")
            if ($value) { Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" }
          }

      - name: Install pinned CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "cmake-windows-x86_64.zip"
          Invoke-WebRequest -Uri $env:CMAKE_ZIP_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($hash -ne $env:CMAKE_ZIP_SHA256) { throw "CMake zip SHA256 mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "cmake")
          $bin = Join-Path $env:RUNNER_TEMP "cmake\cmake-$env:CMAKE_VERSION-windows-x86_64\bin"
          if (-not (Test-Path $bin)) { throw "CMake bin dir not found at $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          cmake --version

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg $vcpkg
          Push-Location $vcpkg
          sh bootstrap-vcpkg.sh
          .\vcpkg.exe version

      - name: Install native MSVC dependencies (FFmpeg, libcurl, pkg-config)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          $installed = Join-Path $env:RUNNER_TEMP "vcpkg-installed"

          # Port "curl" provides libcurl (see ports/curl in the vcpkg repo).
          # Port "pkgconf" provides the native pkg-config executable that the
          # CMake build uses to discover FFmpeg and libcurl.
          # NOTE: the Actions pwsh shell exits the step with $LASTEXITCODE of the
          # last native command, so every native invocation below records its
          # exit code explicitly and the step ends with cmdlet-only statements.
          & "$vcpkg\vcpkg.exe" install --triplet x64-windows --x-install-root $installed ffmpeg curl pkgconf
          $vcpkgExit = $LASTEXITCODE
          Write-Host "vcpkg install exit code: $vcpkgExit"
          if ($vcpkgExit -ne 0) { throw "vcpkg install failed with exit code $vcpkgExit" }

          # CMake's FindPkgConfig module looks up a program named "pkg-config";
          # vcpkg ships it as "pkgconf". vcpkg_copy_tools places the tool in the
          # per-triplet tools directory; the legacy layout <root>\tools\<triplet>\pkgconf
          # is accepted as a fallback in case vcpkg ships it again.
          $pkgconfDir = Join-Path $installed "x64-windows\tools\pkgconf"
          $legacyDir = Join-Path $installed "tools\x64-windows\pkgconf"
          if (-not (Test-Path (Join-Path $pkgconfDir "pkgconf.exe"))) {
            if (Test-Path (Join-Path $legacyDir "pkgconf.exe")) { $pkgconfDir = $legacyDir }
            else { throw "pkgconf.exe not found in $pkgconfDir or $legacyDir" }
          }
          Write-Host "pkgconf tool dir: $pkgconfDir"
          Get-ChildItem $pkgconfDir -File | ForEach-Object { Write-Host "$($_.Length) $($_.Name)" }

          # Copy the whole tool directory, not just the .exe: pkgconf.exe is
          # dynamically linked against pkgconf.dll from this directory (vcpkg
          # default is dynamic linkage), and a lone copy is an unloadable
          # image that fails at process start with "module not found".
          $tools = "C:\ninfer-tools\bin"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Get-ChildItem $pkgconfDir -File | Copy-Item -Destination $tools -Force
          Copy-Item (Join-Path $pkgconfDir "pkgconf.exe") (Join-Path $tools "pkg-config.exe") -Force
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          Write-Host "--- $tools (on PATH from next step) ---"
          Get-ChildItem $tools -File | ForEach-Object { Write-Host "$($_.Length) $($_.Name)" }

          # Probe the exact executable CMake's FindPkgConfig will invoke and
          # record its exit code explicitly (Actions pwsh exits the step with
          # the $LASTEXITCODE of the last native command).
          $pkgConfig = Join-Path $tools "pkg-config.exe"
          & $pkgConfig --version
          $probeExit = $LASTEXITCODE
          Write-Host "pkg-config --version exit code: $probeExit"
          if ($probeExit -ne 0) {
            throw "pkg-config --version failed with exit code $probeExit (missing DLL next to $pkgConfig?)"
          }

          # The C++ build discovers FFmpeg/libcurl through pkg-config .pc
          # files generated by the vcpkg ports.
          # .pc files are installed under the per-triplet lib\pkgconfig dir.
          $pcdir = Join-Path $installed "x64-windows\lib\pkgconfig"
          $pcfiles = Get-ChildItem $pcdir -Filter "*.pc" -ErrorAction Stop | Select-Object -ExpandProperty Name
          Write-Host "pkgconfig modules: $($pcfiles -join ', ')"
          foreach ($need in "libavformat.pc","libavcodec.pc","libavutil.pc","libswscale.pc","libcurl.pc") {
            if ($pcfiles -notcontains $need) { throw "missing $need in $pcdir (found: $($pcfiles -join ', '))" }
          }

      - name: Install CUDA toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "cuda_windows_x86_64.exe"
          Invoke-WebRequest -Uri $env:CUDA_INSTALLER_URL -OutFile $installer
          if ($env:CUDA_INSTALLER_SHA256) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLower()
            if ($hash -ne $env:CUDA_INSTALLER_SHA256) {
              throw "CUDA installer SHA256 mismatch: expected $($env:CUDA_INSTALLER_SHA256), got $hash"
            }
          }

          # Silent install. Since CUDA 13.1 the Windows toolkit no longer
          # bundles the GPU driver, so no driver is installed here.
          $proc = Start-Process -FilePath $installer -ArgumentList "/s" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "CUDA installer exited with $($proc.ExitCode)" }

          $nvcc = Join-Path $env:CUDA_ROOT "bin\nvcc.exe"
          if (-not (Test-Path $nvcc)) { throw "nvcc not found at $nvcc" }
          & $nvcc --version
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:CUDA_ROOT "bin")

      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PKG_CONFIG_LIBDIR = Join-Path (Join-Path $env:RUNNER_TEMP "vcpkg-installed") "x64-windows\lib\pkgconfig"
          $env:PKG_CONFIG_PATH = $env:PKG_CONFIG_LIBDIR
          $cfgLog = Join-Path $env:RUNNER_TEMP "cmake-configure.log"
          $buildLog = Join-Path $env:RUNNER_TEMP "cmake-build.log"

          # Emits literal ::error:: log commands on stdout: GitHub records them
          # as public check-run annotations, so the failure text is readable
          # without authenticated log downloads. Write-Host (not Write-Error)
          # because Write-Error is a terminating error under EAP=Stop.
          function Write-Annotation { param([string]$Message) Write-Host "::error::$Message" }

          # Pre-flight probes: every tool the build depends on, with explicit
          # exit codes, so a missing executable is named in the annotation.
          $probes = @(
            @("cmake", @("--version")),
            @("ninja", @("--version")),
            @("$env:CUDA_ROOT\bin\nvcc.exe", @("--version")),
            @("cl.exe", @("--version")),
            @("C:\ninfer-tools\bin\pkg-config.exe", @("--version")),
            @("C:\ninfer-tools\bin\pkg-config.exe", @("--modversion libavformat libavcodec libavutil libswscale libcurl"))
          )
          foreach ($p in $probes) {
            $exe = $p[0]
            $pargs = $p[1]
            $cmd = Get-Command $exe -ErrorAction SilentlyContinue
            if (-not $cmd) {
              Write-Annotation "pre-flight probe failed: executable not found: $exe"
              throw "executable not found: $exe"
            }
            try {
              $out = (& $exe @pargs 2>&1 | Out-String)
            } catch {
              Write-Annotation "pre-flight probe threw for: $exe $($pargs -join ' ') -> $($_.Exception.Message)"
              throw
            }
            $code = $LASTEXITCODE
            $first = (($out -split "\r?\n") | Where-Object { $_.Trim() })[0]
            Write-Host "probe: $exe $($pargs -join ' ') -> exit $code | $first"
            if ($code -ne 0) {
              Write-Annotation "pre-flight probe failed: $exe $($pargs -join ' ') exited $code | $first"
              throw "pre-flight probe failed: $exe $($pargs -join ' ') exited $code"
            }
          }

          # Reports a cmake phase failure as a public annotation: a header plus
          # up to 8 error-looking lines from the captured log tail.
          function Report-CMakeFailure { param([string]$Phase, [int]$ExitCode, [string]$LogPath)
            Write-Annotation "$Phase failed (exit $ExitCode)"
            $tail = @()
            if (Test-Path $LogPath) { $tail = Get-Content $LogPath -Tail 200 }
            $interesting = @($tail | Where-Object { $_ -match "(?i)\b(error|fatal|failed|undefined|not found|cannot|missing)" })
            if ($interesting.Count -eq 0 -and $tail.Count -gt 0) { $interesting = $tail | Select-Object -Last 8 }
            $interesting | Select-Object -First 8 | ForEach-Object { Write-Annotation "$_" }
            if ($tail.Count -eq 0) { Write-Annotation "(log $LogPath is empty)" }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### $Phase failed (exit $ExitCode)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            $tail | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          }

          & cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl *>&1 | Tee-Object -FilePath $cfgLog
          $cfg = $LASTEXITCODE
          if ($cfg -ne 0) {
            Report-CMakeFailure "cmake configure" $cfg $cfgLog
            throw "cmake configure failed with exit code $cfg"
          }

          & cmake --build build -j *>&1 | Tee-Object -FilePath $buildLog
          $build = $LASTEXITCODE
          if ($build -ne 0) {
            Report-CMakeFailure "cmake build" $build $buildLog
            throw "cmake build failed with exit code $build"
          }

      - name: Validate build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = @("build\apps\ninfer.exe", "build\apps\ninfer-serve.exe")
          foreach ($path in $artifacts) {
            if (-not (Test-Path $path)) { throw "missing build artifact $path" }
            "{0}: {1} bytes" -f $path, (Get-Item $path).Length
          }

          $env:PKG_CONFIG_LIBDIR = Join-Path (Join-Path $env:RUNNER_TEMP "vcpkg-installed") "x64-windows\lib\pkgconfig"
          $env:PKG_CONFIG_PATH = $env:PKG_CONFIG_LIBDIR

          Write-Host "=== toolchain summary ==="
          cmake --version | Select-Object -First 1
          & "$env:CUDA_ROOT\bin\nvcc.exe" --version
          & "C:\ninfer-tools\bin\pkg-config.exe" --modversion libavformat libavcodec libavutil libswscale libcurl

      - name: Upload Windows binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-x64-sm120a
          path: |
            build/apps/ninfer.exe
            build/apps/ninfer-serve.exe
          if-no-files-found: error

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows native build"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Native MSVC + CUDA 13.4 build for sm_120a (compile/link only; no GPU on hosted runners)."
          
